name: Aura nosignal isolated validation
run-name: Aura nosignal ${{ inputs.target_sha }} ${{ inputs.artifact_hash }}
on:
  workflow_dispatch:
    inputs:
      target_sha:
        required: true
        type: string
      artifact_hash:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: aura-nosignal-validation
  cancel-in-progress: false
jobs:
  diagnostic:
    name: aura-nosignal-network-diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
      ARTIFACT_HASH: ${{ inputs.artifact_hash }}
    steps:
      - name: Measure isolated browser connectivity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$ARTIFACT_HASH" =~ ^[a-f0-9]{64}$ ]]
          test -x /opt/google/chrome/chrome
          /opt/google/chrome/chrome --version
          probe_script="$(mktemp /tmp/aura-network-probe.XXXXXX)"
          trap 'rm -f "$probe_script"' EXIT
          cat > "$probe_script" <<'PROBE_SCRIPT'
          #!/usr/bin/env bash
          # Trusted test-environment probe only. No repository code is executed.
          set -euo pipefail
          worker_uid="$1"
          worker_gid="$2"
          chrome="$3"
          [[ "$worker_uid" =~ ^[1-9][0-9]*$ && "$worker_gid" =~ ^[1-9][0-9]*$ ]]
          [[ "$chrome" == /opt/google/chrome/chrome ]]
          ip link set lo up
          probe_home="$(mktemp -d /tmp/aura-online-probe.XXXXXX)"
          trap 'rm -rf "$probe_home"' EXIT
          chown "$worker_uid:$worker_gid" "$probe_home"
          probe() {
            local phase="$1"
            local result
            result="$(setpriv --reuid "$worker_uid" --regid "$worker_gid" --clear-groups --no-new-privs env -i PATH=/usr/bin:/bin HOME="$probe_home" timeout 10s "$chrome" --headless=new --no-sandbox --disable-gpu --disable-background-networking --disable-component-update --no-first-run --no-default-browser-check --user-data-dir="$probe_home/$phase" --dump-dom 'data:text/html,<body><script>document.write("AURA_ONLINE_"+navigator.onLine)</script></body>' 2>/dev/null)"
            if [[ "$result" == *'>AURA_ONLINE_true<'* ]]; then
              printf 'AURA_BROWSER_STATE {"phase":"%s","online":true}\n' "$phase"
            elif [[ "$result" == *'>AURA_ONLINE_false<'* ]]; then
              printf 'AURA_BROWSER_STATE {"phase":"%s","online":false}\n' "$phase"
            else
              echo 'AURA_PROBE_INVALID_BROWSER_OUTPUT' >&2
              exit 1
            fi
          }
          probe loopback_only
          # This interface has no peer, bridge, gateway or path outside this namespace.
          ip link add aura0 type dummy
          ip address add 192.0.2.1/32 dev aura0 noprefixroute
          ip link set aura0 up
          ip -j -d link show | jq -e 'length == 2 and ([.[].ifname] | sort) == ["aura0","lo"] and ([.[] | select(.ifname == "aura0")][0].linkinfo.info_kind == "dummy")' >/dev/null
          ip -j route show table main | jq -e 'length == 0' >/dev/null
          ip -j -6 route show table main | jq -e 'all(.[]; .dst != "default" and .dev == "aura0" and (.dst | startswith("fe80:")))' >/dev/null
          if ip route get 1.1.1.1 >/dev/null 2>&1 || ip route get 172.17.0.1 >/dev/null 2>&1 || ip -6 route get 2606:4700:4700::1111 >/dev/null 2>&1; then
            echo 'AURA_PROBE_UNEXPECTED_ROUTE' >&2
            exit 1
          fi
          printf 'AURA_NETWORK_ISOLATION {"externalRoute":false,"hostRoute":false,"dummyHasPeer":false}\n'
          probe isolated_dummy
          PROBE_SCRIPT
          chmod 444 "$probe_script"
          sudo -n systemd-run --scope --quiet -p MemoryMax=6G -p CPUQuota=400% /usr/bin/env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin /usr/bin/timeout 35s /usr/bin/unshare --net /usr/bin/bash "$probe_script" "$(id -u)" "$(id -g)" /opt/google/chrome/chrome
